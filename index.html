<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Omar Taoussi">
<meta name="description" content="LASMAR – Laboratoire de Spectrométrie des Matériaux et Archéomatériaux, URL-CNRST N°7, Faculté des Sciences, Université Moulay Ismaïl, Meknès">
<title>LASMAR – UMI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: sticky nav + hash-routed views; hero pairs lab identity with a live spectrum figure (XRF / EEM). Trilingual FR/EN/AR (RTL). */
:root{
  --bg:#f4f7f7; --surface:#ffffff; --ink:#0f2a30; --muted:#4f666b; --line:#d6e1e2;
  --accent:#0b6e6c; --accent-soft:#dcefee; --ochre:#b8741f; --ochre-soft:#f6ead9;
  --f-display:"Sora",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --eem0:#f4f7f7; --eem1:#7cc6c1; --eem2:#0b6e6c; --eem3:#b8741f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a1d; --surface:#122428; --ink:#e3eeee; --muted:#9db3b6; --line:#24393d;
  --accent:#4cc2bb; --accent-soft:#163b3c; --ochre:#e0a352; --ochre-soft:#3a2c18;
  --eem0:#0c1a1d; --eem1:#1d5a5a; --eem2:#4cc2bb; --eem3:#e0a352; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a1d; --surface:#122428; --ink:#e3eeee; --muted:#9db3b6; --line:#24393d;
  --accent:#4cc2bb; --accent-soft:#163b3c; --ochre:#e0a352; --ochre-soft:#3a2c18;
  --eem0:#0c1a1d; --eem1:#1d5a5a; --eem2:#4cc2bb; --eem3:#e0a352; color-scheme:dark}
html[lang="ar"]{--f-display:"IBM Plex Sans Arabic","Sora",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic",system-ui,sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
html[lang="ar"] body{font-size:17px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:clamp(1.6rem,3vw,2.1rem)}
h3{font-size:1.1rem}
p{margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre)}
html[lang="ar"] .eyebrow{font-family:var(--f-body);letter-spacing:0;font-size:.85rem;font-weight:600}
.lead{color:var(--muted);max-width:68ch;font-size:1.05rem}
.ltr{direction:ltr;unicode-bidi:isolate}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--surface);font-family:"Sora",sans-serif;font-weight:700;font-size:1.05rem}
.brand b{font-family:"Sora",sans-serif;font-size:1.15rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.74rem;display:block;max-width:250px;line-height:1.3}
.wide{max-width:1360px}
.credit{width:100%;border-top:1px solid var(--line);padding-top:16px;font-size:.84rem}
.credit b{color:var(--ink);font-weight:600}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-size:.82rem;font-weight:600;padding:6px 10px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.theme button{display:grid;place-items:center;padding:6px 9px}
nav{flex:1;display:flex;justify-content:center}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:2px}
nav a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--accent-soft)}
nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
@media (max-width:1240px){
  .menu-btn{display:block}
  nav{display:none;width:100%;order:3;justify-content:flex-start}
  nav.open{display:block}
  nav ul{flex-direction:column;padding-bottom:12px}
  .bar{flex-wrap:wrap}
}

/* sections */
main section.view{padding-block:48px 72px}
.head{display:grid;gap:12px;margin-bottom:32px}
.sub{margin-block:48px 20px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:10px;align-content:start;min-width:0}
.card p{color:var(--muted)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;background:var(--accent);color:var(--surface);text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.more{text-decoration:none;font-weight:500}
.label{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;padding:5px 10px;border-radius:8px;background:var(--ochre-soft);color:var(--ochre);width:max-content;max-width:100%}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:48px 40px}
.hero h1{font-size:clamp(1.9rem,4.2vw,3.1rem);letter-spacing:-.01em}
html[lang="ar"] .hero h1{letter-spacing:0;line-height:1.35}
.hero h1 span{color:var(--accent)}
.hero-txt{display:grid;gap:20px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin:0;display:grid;gap:10px}
.fig canvas{width:100%;aspect-ratio:4/3;max-width:100%;display:block}
.fig figcaption{font-size:.8rem;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.8rem;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-block:1px solid var(--line);margin-block:8px 48px}
.stat{padding:20px 16px;border-inline-end:1px solid var(--line)}
.stat:last-child{border-inline-end:0}
.stat b{font-family:"Sora",sans-serif;font-size:1.9rem;display:block;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}

/* info table (lab) */
.info{display:grid;grid-template-columns:minmax(140px,220px) 1fr;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.info dt,.info dd{padding:16px 20px;border-bottom:1px solid var(--line);margin:0}
.info dt{color:var(--muted);font-weight:600;font-size:.88rem}
.info dd{font-weight:500}
.info dt:last-of-type,.info dd:last-of-type{border-bottom:0}
@media (max-width:600px){.info{grid-template-columns:1fr}.info dt{border-bottom:0;padding-bottom:0}}

/* teams */
.team{border-top:4px solid var(--ochre)}
.team .acr{font-family:"Sora",sans-serif;font-size:1.5rem;font-weight:700;color:var(--accent);letter-spacing:.02em}

/* axes */
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 32px}
.axis{display:grid;grid-template-columns:auto 1fr;gap:14px;padding-block:18px;border-bottom:1px solid var(--line)}
.axis i{font-style:normal;width:10px;height:10px;border-radius:2px;background:var(--ochre);margin-top:8px}
.axis h3{font-family:var(--f-body);font-size:1rem;font-weight:600}
.axis p{color:var(--muted);font-size:.92rem;margin-top:4px}

/* members */
.member{position:relative;overflow:hidden}
.member::after{content:"";position:absolute;inset-block-start:0;inset-inline-end:0;width:46px;height:46px;background:linear-gradient(to bottom left,var(--ochre) 50%,transparent 50%)}
html[dir="rtl"] .member::after{background:linear-gradient(to bottom right,var(--ochre) 50%,transparent 50%)}
.member h3{font-size:1rem;padding-inline-end:40px}
.member .mail{font-size:.88rem;color:var(--muted);word-break:break-all;direction:ltr;text-align:start;unicode-bidi:isolate}
.member .mail a{color:inherit;text-decoration:none}
.member .mail a:hover{color:var(--accent);text-decoration:underline}
.member .desc{font-size:.88rem}
.badge{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:6px;width:max-content;max-width:100%}
.badge.dir{background:var(--accent);color:var(--surface)}
.badge.lead{background:var(--accent-soft);color:var(--accent)}
.badge.prof,.badge.other{background:var(--ochre-soft);color:var(--ochre)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.filters button{font:inherit;font-size:.88rem;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.filters small{opacity:.75;margin-inline-start:4px;font-variant-numeric:tabular-nums}

/* publications */
.pubs{display:grid;border-top:1px solid var(--line)}
.pub{display:grid;grid-template-columns:70px 1fr;gap:16px;padding-block:18px;border-bottom:1px solid var(--line)}
.pub .yr{font-family:var(--f-mono);color:var(--ochre);font-variant-numeric:tabular-nums}
.pub h3{font-family:var(--f-body);font-weight:600;font-size:1rem}
.pub p{color:var(--muted);font-size:.92rem}
.search{width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-block:6px 16px}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.92rem}
th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}

/* news */
.news{display:grid;grid-template-columns:auto 1fr;gap:16px}
.date{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:72px;height:max-content}
.date b{display:block;font-size:1.4rem;font-family:"Sora",sans-serif;color:var(--accent)}
.date small{font-size:.72rem;color:var(--muted)}

/* contact */
form{display:grid;gap:14px}
label{font-weight:500;font-size:.9rem;display:grid;gap:6px}
input,textarea,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.note{font-size:.88rem;color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.kv dt{font-size:.78rem;text-transform:uppercase;color:var(--muted);padding-top:3px;font-weight:600}
.kv dd{margin:0}

/* conferences */
.conf{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:start;padding-block:18px;border-bottom:1px solid var(--line)}
.conf h3{font-family:var(--f-body);font-size:1rem;font-weight:600}
.conf p{color:var(--muted);font-size:.9rem}
@media (max-width:600px){.conf{grid-template-columns:auto 1fr}.conf .badge{grid-column:2}}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.gal .ph-img{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;color:var(--accent);background:repeating-linear-gradient(135deg,var(--accent-soft) 0 14px,var(--surface) 14px 28px)}
.gal img{aspect-ratio:4/3;width:100%;object-fit:cover;display:block}
.gal figcaption{padding:10px 14px;font-size:.88rem;color:var(--muted)}
.gal figcaption b{display:block;color:var(--ink);font-weight:600}
.partner{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.partner .ini{width:48px;height:48px;border-radius:10px;background:var(--ochre-soft);color:var(--ochre);display:grid;place-items:center;font-family:"Sora",sans-serif;font-weight:700;font-size:.8rem}
footer{border-top:1px solid var(--line);background:var(--surface);padding-block:32px;color:var(--muted);font-size:.88rem}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
.ph{background:var(--accent-soft);border-radius:4px;padding:0 4px}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .35s ease}}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

</head>
<body>
<header>
  <div class="wrap wide bar">
    <a class="brand" href="#accueil">
      <div class="logo" aria-hidden="true">L</div>
      <div><b>LASMAR</b><small data-i="univ"></small></div>
    </a>
    <nav id="mainNav"><ul id="navList"></ul></nav>
    <div class="tools">
      <div class="lang" role="group" aria-label="Langue / Language / اللغة">
        <button type="button" data-lang="fr" lang="fr">FR</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="ar" lang="ar">عربي</button>
      </div>
      <div class="lang theme" role="group" id="themeSeg">
        <button type="button" data-theme-set="light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-set="dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="mainNav" data-i="menu"></button>
    </div>
  </div>
</header>

<main>
  <!-- ACCUEIL -->
  <section class="view" data-view="accueil">
    <div class="wrap">
      <div class="hero">
        <div class="hero-txt">
          <span class="label">URL-CNRST N°7</span>
          <h1 data-i="heroTitle"></h1>
          <p class="lead" data-i="heroLead"></p>
          <div class="actions">
            <a class="btn" href="#recherche" data-i="ctaResearch"></a>
            <a class="btn ghost" href="#equipe" data-i="ctaTeam"></a>
          </div>
        </div>
        <figure class="fig">
          <div class="seg" role="group" id="figSeg">
            <button type="button" data-fig="xrf" data-i="figXrfBtn"></button>
            <button type="button" data-fig="eem" data-i="figEemBtn"></button>
          </div>
          <canvas id="spec" width="640" height="480"></canvas>
          <figcaption id="figCap"></figcaption>
        </figure>
      </div>
      <div class="stats" id="stats"></div>

      <div class="head" style="margin-bottom:20px"><span class="eyebrow" data-i="labEyebrow"></span><h2 data-i="labTitle"></h2></div>
      <dl class="info" id="info"></dl>
      <div class="grid g2" id="labCards" style="margin-block:20px 48px"></div>

      <div class="head" style="margin-bottom:20px"><span class="eyebrow" data-i="teamsEyebrow"></span></div>
      <div class="grid g3" id="homeTeams" style="margin-bottom:48px"></div>

      <div class="grid g2">
        <div class="card">
          <span class="eyebrow" data-i="recentNews"></span>
          <div id="homeNews" class="grid" style="gap:16px"></div>
          <a class="more" href="#conferences" data-i="allNews"></a>
        </div>
        <div class="card">
          <span class="eyebrow" data-i="recentPubs"></span>
          <div id="homePubs" class="grid" style="gap:14px"></div>
          <a class="more" href="#publications" data-i="allPubs"></a>
        </div>
      </div>
    </div>
  </section>


  <!-- RECHERCHE -->
  <section class="view" data-view="recherche" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="resEyebrow"></span>
        <h2 data-i="teamsTitle"></h2>
        <p class="lead" data-i="resLead"></p>
      </div>
      <div class="grid g3" id="teams"></div>
      <div class="head sub"><h2 data-i="axesTitle"></h2></div>
      <div class="axes" id="axes"></div>
      <div class="head sub"><h2 data-i="projTitle"></h2></div>
      <div class="grid g3" id="projects"></div>
      <div class="head sub"><h2 data-i="eqTitle"></h2><p class="lead" data-i="eqLead"></p></div>
      <div class="grid g3" id="equip"></div>
    </div>
  </section>

  <!-- EQUIPE -->
  <section class="view" data-view="equipe" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="teamEyebrow"></span>
        <h2 data-i="teamTitle"></h2>
      </div>
      <div class="filters" id="memberFilters"></div>
      <div class="grid g4" id="members"></div>
    </div>
  </section>

  <!-- PUBLICATIONS -->
  <section class="view" data-view="publications" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="pubEyebrow"></span>
        <h2 data-i="pubTitle"></h2>
      </div>
      <label for="pubSearch"><span data-i="search"></span>
        <input id="pubSearch" class="search" type="search">
      </label>
      <div class="pubs" id="pubs"></div>
    </div>
  </section>



  <!-- CONFERENCES -->
  <section class="view" data-view="conferences" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="confEyebrow"></span>
        <h2 data-i="confTitle"></h2>
      </div>
      <div class="filters" id="confFilters"></div>
      <div id="confs" style="border-top:1px solid var(--line)"></div>
      <div class="head sub"><h2 data-i="newsTitle"></h2></div>
      <div class="grid" id="news" style="gap:22px;max-width:820px"></div>
    </div>
  </section>

  <!-- COLLABORATEURS -->
  <section class="view" data-view="collaborateurs" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="collabEyebrow"></span>
        <h2 data-i="partnersTitle"></h2>
        <p class="lead" data-i="collabLead"></p>
      </div>
      <div class="grid g3" id="partners"></div>
      <div class="head sub"><h2 data-i="collabTitle"></h2></div>
      <div class="grid g4" id="collabs"></div>
    </div>
  </section>

  <!-- GALERIE -->
  <section class="view" data-view="galerie" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="galEyebrow"></span>
        <h2 data-i="galTitle"></h2>
        <p class="lead" data-i="galLead"></p>
      </div>
      <div class="gal" id="gallery"></div>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="view" data-view="contact" hidden>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i="contactEyebrow"></span>
        <h2 data-i="contactTitle"></h2>
      </div>
      <div class="grid g2">
        <div class="card">

function hex(c){c=c.trim().replace("#","");return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
function prep(){
  const cv=$("#spec"),ctx=cv.getContext("2d"),cs=getComputedStyle(document.documentElement);
  const g=v=>cs.getPropertyValue(v).trim();
  ctx.setTransform(1,0,0,1,0,0);ctx.direction="ltr";ctx.fillStyle=g("--surface");ctx.fillRect(0,0,cv.width,cv.height);
  return{cv,ctx,g,cs,lf:lang==="ar"?"'IBM Plex Sans Arabic',sans-serif":"'IBM Plex Mono',monospace"};
}
function drawFig(){
  document.querySelectorAll("[data-fig]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.fig===fig));
  const cap=T(fig==="xrf"?UI.figXrf:UI.figEem);$("#figCap").textContent=cap;$("#spec").setAttribute("aria-label",cap);
  $("#figSeg").setAttribute("aria-label",{fr:"Choisir la figure",en:"Choose figure",ar:"اختيار الشكل"}[lang]);
  fig==="xrf"?drawXRF():drawEEM();
}
function drawXRF(){
  const{cv,ctx,g,lf}=prep();const W=cv.width,H=cv.height,L=58,R=14,Tp=24,B=48,pw=W-L-R,ph=H-Tp-B;
  const e0=0,e1=14;
  const lines=[["Si Kα",1.74,.07],["Ca Kα",3.69,.10],["Fe Kα",6.40,.22],["Fe Kβ",7.06,.05],["Cu Kα",8.05,1],["Cu Kβ",8.90,.17],["Pb Lα",10.55,.55],["Pb Lβ",12.61,.42],["Sn Lα",3.44,.06]];
  const sig=e=>0.055+0.012*e;
  const f=e=>{let v=0.035*Math.exp(-((e-9)**2)/40)*(e>1?1:e);for(const[,c,a]of lines)v+=a*Math.exp(-((e-c)**2)/(2*sig(c)**2));return v};
  const N=pw,ys=[];let mx=0;for(let i=0;i<=N;i++){const v=f(e0+(i/N)*(e1-e0));ys.push(v);mx=Math.max(mx,v)}
  const X=e=>L+(e-e0)/(e1-e0)*pw,Y=v=>Tp+ph-(v/(mx*1.12))*ph;
  ctx.strokeStyle=g("--line");ctx.lineWidth=1;
  for(let k=0;k<=4;k++){const y=Tp+ph*k/4;ctx.beginPath();ctx.moveTo(L,y+.5);ctx.lineTo(L+pw,y+.5);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(L,Tp+ph);ys.forEach((v,i)=>ctx.lineTo(L+i,Y(v)));ctx.lineTo(L+pw,Tp+ph);ctx.closePath();
  ctx.fillStyle=g("--accent-soft");ctx.fill();
  ctx.beginPath();ys.forEach((v,i)=>i?ctx.lineTo(L+i,Y(v)):ctx.moveTo(L,Y(v)));ctx.strokeStyle=g("--accent");ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle=g("--muted");ctx.lineWidth=1;ctx.strokeRect(L+.5,Tp+.5,pw-1,ph-1);
  ctx.fillStyle=g("--muted");ctx.font="13px 'IBM Plex Mono',monospace";ctx.textAlign="center";
  for(let e=0;e<=14;e+=2)ctx.fillText(e,X(e),Tp+ph+18);
  ctx.font="13px "+lf;ctx.fillText(T(UI.xrfX),L+pw/2,H-8);
  ctx.save();ctx.translate(18,Tp+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(T(UI.xrfY),0,0);ctx.restore();
  ctx.font="600 12px 'IBM Plex Mono',monospace";
  const lab=[["Si Kα",1.74],["Ca Kα",3.69],["Fe Kα",6.40],["Cu Kα",8.05],["Cu Kβ",8.90],["Pb Lα",10.55],["Pb Lβ",12.61]];
  lab.forEach(([n,e],i)=>{const y=Y(f(e))-8;ctx.fillStyle=n.startsWith("Cu")||n.startsWith("Pb")?g("--ochre"):g("--ink");
    const dy=n==="Cu Kβ"?-0:0;ctx.fillText(n,X(e)+(n==="Cu Kβ"?14:0),Math.max(Tp+12,y+dy))});
}
function drawEEM(){
  const{cv,ctx,g,lf}=prep();
  const stops=["--eem0","--eem1","--eem2","--eem3"].map(v=>hex(g(v)));
  const W=cv.width,H=cv.height,L=58,R=14,Tp=14,B=48,pw=W-L-R,ph=H-Tp-B;
  const ex0=230,ex1=450,em0=280,em1=600;
  const peaks=[[275,305,.45,12,14],[275,340,.7,14,22],[250,450,1,16,55],[315,400,.55,18,40],[340,440,.8,22,50]];
  const col=t=>{t=Math.min(1,Math.max(0,t));const s=t*3,i=Math.min(2,Math.floor(s)),f=s-i;return stops[i].map((a,k)=>Math.round(a+(stops[i+1][k]-a)*f))};
  const img=ctx.createImageData(pw,ph);
  for(let y=0;y<ph;y++){const ex=ex1-(y/ph)*(ex1-ex0);
    for(let x=0;x<pw;x++){const em=em0+(x/pw)*(em1-em0);let v=0;
      if(em>ex+15){for(const[pe,pm,a,se,sm]of peaks)v+=a*Math.exp(-((ex-pe)**2)/(2*se*se)-((em-pm)**2)/(2*sm*sm));}
      const c=col(Math.floor(Math.min(v,1)*9)/9);const o=(y*pw+x)*4;
      img.data[o]=c[0];img.data[o+1]=c[1];img.data[o+2]=c[2];img.data[o+3]=255;}}
  ctx.putImageData(img,L,Tp);
  ctx.strokeStyle=g("--muted");ctx.lineWidth=1;ctx.strokeRect(L+.5,Tp+.5,pw-1,ph-1);
  ctx.fillStyle=g("--muted");ctx.font="13px 'IBM Plex Mono',monospace";ctx.textAlign="center";
  for(let em=300;em<=600;em+=50)ctx.fillText(em,L+(em-em0)/(em1-em0)*pw,Tp+ph+18);
  ctx.textAlign="right";for(let ex=250;ex<=450;ex+=50)ctx.fillText(ex,L-8,Tp+(ex1-ex)/(ex1-ex0)*ph+4);
  ctx.font="13px "+lf;ctx.textAlign="center";ctx.fillText(T(UI.eemEm),L+pw/2,H-8);
  ctx.save();ctx.translate(14,Tp+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(T(UI.eemEx),0,0);ctx.restore();
  ctx.fillStyle=g("--ink");ctx.font="600 14px 'Sora',sans-serif";
  [["B",275,305],["T",275,340],["A",250,450],["M",315,400],["C",340,440]].forEach(([n,ex,em])=>ctx.fillText(n,L+(em-em0)/(em1-em0)*pw,Tp+(ex1-ex)/(ex1-ex0)*ph+5));
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{applyTheme();drawFig()});
new MutationObserver(m=>{if(m.some(r=>r.attributeName==="data-theme"))drawFig()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
document.fonts&&document.fonts.ready.then(drawFig);
render();
</script>
